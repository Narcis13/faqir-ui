name: Browser smoke

# The runtime gate three silent 1.0 defects walked past (task W2-1).
#
# Two suites already run a browser and neither could have caught them. The visual
# suite (playwright.config.ts) renders every component with `animations: disabled`
# and loads NO controller JS — it captures authored markup, which is what makes a
# screenshot deterministic. The `bun test` suites run the controllers, but under
# happy-dom, where `getComputedStyle` reports no transition and events do not
# bubble the way a layout engine bubbles them.
#
# Between the two sat a class of defect with no observer at all:
#
#   • `l-validate` never ran, because bootstrap only walked out from `[l-data]` /
#     `[data-ui]` roots and the canonical `<form l-validate>` is neither;
#   • `l-effect` never ran on a scope root — the placement the docs recommend —
#     and worked fine on a child, so every unit test of it passed;
#   • `drawer` never finalised `closing → closed` when dismissed through its close
#     button, because that button's own `background` transitionend bubbles to the
#     panel and was eaten by the one-shot listener waiting for `transform`.
#
# All three are silent: no error, no warning, correct-looking markup. This job
# runs the shipped engine against the shipped CSS in a real layout engine, with
# motion ON, and drives a real pointer — the only configuration in which they are
# observable. It needs no baselines and no sharding: every assertion is about DOM
# state, not pixels.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Directives and dismissal paths
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Run browser smoke suite
        run: npx playwright test --config=playwright.browser.config.ts --reporter=list
