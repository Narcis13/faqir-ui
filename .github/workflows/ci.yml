name: CI

# Task 0.3-12 · FAQIR-PLAN §10.4
# Five gates, every push and PR:
#   1. test            — full suite on the pinned Bun
#   2. smoke           — compiled CLI on plain Node 18/20/22 (no Bun runtime)
#   3. typecheck       — tsc --noEmit
#   4. registry-audit  — logical-properties over registry/**, zero findings
#   5. size            — gzip budgets (engine ≤14KB, engine+controllers ≤41KB, plugins ≤2KB)

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# Bun is PINNED, not `latest`. Two gates below byte-compare a committed artifact
# against a fresh `bun build --minify`, and minifier output is not stable across
# Bun releases — on `latest` the audit gate went red the day Bun shipped 1.3.14,
# with no change to the repo:
#
#   • `check:audit-browser`  → site/lib/faqir-audit.js
#   • `check:core-package`   → packages/core/cdn.json (SHA-384 of the minified
#                              engine, so a Bun bump moves every hash in it)
#
# Bump this in one place, then re-run BOTH `bun run build:audit-browser` and
# `bun run build:core-package` and commit the regenerated artifacts.
env:
  BUN_VERSION: "1.3.8"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # (1) Full test suite on the Bun runtime.
  test:
    name: Test (Bun, pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      # `packages/core/dist/` is git-ignored, so on a bare checkout the suite's
      # cdn.json↔sri.json agreement check (tests/generator/docs-agents.test.ts)
      # has nothing to compare against and passes vacuously. Build the package
      # first so it compares something. The authoritative gate is
      # `check:core-package` in the registry-audit job.
      - run: bun run build:core-package
      # NOT a bare `bun test`: scripts/test.mjs splits the suite so the two
      # engine builds never share a process. See the header of that file.
      - run: bun run test

  # (3) TypeScript typecheck of src + tests.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun run typecheck

  # (4) Registry self-audit — the framework's own rule engine over registry/**.
  #     Any physical, direction-bound CSS reintroduced into the registry fails here.
  registry-audit:
    name: Registry self-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run audit:registry
      # Manifest schema + generated-skill drift gates (task 0.5-07): every
      # manifest carries an up-to-date $schema, and the shipped faqir-creator
      # skill matches a fresh manifest-derived generation.
      - run: bun run check:schema-refs
      - run: bun run check:skill
      # Bindings drift gate (tasks 0.6-12/0.7-01, §11.1): the committed
      # @faqir-ui/vue and @faqir-ui/react components must byte-match a fresh
      # `faqir bindings <target>` regeneration.
      - run: bun run check:bindings
      # Docs site (task 0.7-13, §13): the site is generated from the manifests,
      # so a manifest or registry change that the generator cannot render must
      # fail here rather than at deploy time. The output is git-ignored, so this
      # builds it rather than diffing it; the page-level audit/axe gates live in
      # `bun test` and the a11y workflow.
      - run: bun run build:docs
      # Browser audit bundle (task 0.7-14, §13): the playground's engine is
      # committed at site/lib/faqir-audit.js because the site generator only
      # copies files. This is its drift gate — a change to the audit rules that
      # was never recompiled fails here, next to the other generated artifacts.
      - run: bun run check:audit-browser
      # CDN pin manifest (task 0.7-15, §10.3): packages/core/cdn.json is the one
      # committed generated artifact whose staleness is silently FATAL in a
      # browser. src/generator/docs.ts emits its hashes verbatim as
      # `integrity="sha384-…"` into every copy-paste CDN snippet, and SRI is
      # fail-closed — a hash that does not match the bytes makes the browser
      # refuse to execute the file at all. It shipped two commits stale, which is
      # a blank page on the framework's headline "two tags, no build step" path.
      # Same Bun-pinning caveat as check:audit-browser above.
      - run: bun run check:core-package

  # (5) Size budgets. Reassemble the engine from source first so the measurement
  #     reflects the current registry, then enforce the gzip budgets.
  size:
    name: Size budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Reassemble engine (faqir-core.js + faqir-core.dev.js)
        run: bun run build:core
      - name: Enforce gzip budgets
        run: bun run size

  # (2) Compiled-CLI smoke test on plain Node, across the supported matrix.
  #     Bun builds dist/faqir.mjs; Node (matrix version) runs it — exactly the
  #     path taken on a machine with no Bun installed. See scripts/smoke-cli.sh.
  smoke:
    name: Smoke CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Build with Bun, run on Node ${{ matrix.node }}
        run: bash scripts/smoke-cli.sh
