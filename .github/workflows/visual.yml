name: Visual regression

# Task 0.4-23 · FAQIR-PLAN §12.2 · viewport axis added by 0.8-11 (§19)
#
# Playwright screenshot matrix, generated from the registry at runtime
# (tests/visual/matrix.ts): every component × every theme × light/dark × LTR/RTL.
# Everything runs inside the pinned Playwright Linux container so font
# rasterisation — and therefore every captured pixel — is byte-stable between the
# machine that produced a baseline and the one that diffs it.
#
# Snapshot count at the current registry (86 components, 12 themes):
#
#   main matrix   86 × 12 × 2 × 2                        = 4 128
#   viewport axis 26 layout-bearing × 3 widths           =    78   (0.8-11)
#   density       3 themes × 2 schemes                   =     6
#   scaffolds     invoice + report                       =     2
#                                                          ─────
#                                                          4 214 screenshots
#                                                                (4 264 tests)
#
# The layout gate (tests/visual/layout-lint.pw.ts, task 0.9-01) rides in the same
# run and takes no screenshots: it loads all 186 generated docs pages at each of
# its two viewports — 1280×900 and, since 1.0R-06, 375×812 — and compares four
# measured counts per viewport against the committed tests/visual/layout-budget.json.
# The phone pass is the same job and the same file: no new workflow, ~7s more.
# It is a serial file, so sharding keeps its tests together in one shard.
#
# Its per-component counterpart (tests/visual/narrow-fit.pw.ts, task 1.0R-07)
# rides along too and takes no screenshots either: 20 tests that mount one
# reference at a time at 320/375 and in a container 60% of its own max-content
# width, and assert nothing paints outside it — a wall with no budget, plus one
# reverting case per fix so it cannot go green on an inert assertion. ~2s.
#
# The viewport axis (tests/visual/responsive.pw.ts) sweeps only category-`layout`
# components and patterns, at 390/768/1280, in the default theme, light, LTR —
# 78 captures. The full cross-product would have been 26 × 3 × 12 × 2 × 2 = 3 744,
# i.e. +90% on the whole suite, for information the single-viewport matrix already
# carries: a theme changes colours, a direction mirrors the axis, and neither
# changes which `@media (min-width: …)` block matched.
#
# Sharding is unchanged at ×4: the axis adds 90 tests (78 captures + a tripwire,
# three pre-assertion negatives and eight archetype cases) to a 4 145-test suite —
# ≈+2%, roughly 23 per shard. Reshard when a shard stops finishing in ~1 min.
#
# Baseline strategy (the "CI artifact strategy" of §12.2 — no thousands of PNGs in
# git): the default branch produces the baseline set and persists it to the
# GitHub Actions cache; pull requests restore that set, diff against it (sharded),
# and upload a single merged HTML diff report. Intended visual changes surface as
# diffs to approve, then regenerate on merge. See tests/visual/README.md.
#
# THE BASELINE JOB DIFFS BEFORE IT RE-BASELINES (W3-5). It used to go straight to
# `--update-snapshots` on every push to `main`, which meant a change that reached
# `main` without a PR — a direct push, an admin merge, a hotfix — was never
# compared to anything: whatever it rendered simply became the new truth, and the
# next PR diffed against the regression. So the job now restores the previous
# baseline set and runs the suite as a DIFF first. A difference fails the job and
# names itself in an uploaded report. Blessing an intended change on a direct
# push is explicit: put `[visual-baseline]` in the commit message, or run the
# workflow from the Actions tab (`workflow_dispatch`), which skips the diff.
#
# PR runs say when they are diffing against a STALE set (W3-5). `restore-keys`
# falls back to the newest baseline from `main` whenever this PR changed anything
# in the cache key — which is exactly when the fallback is most misleading, since
# a green shard then means "no difference from an older render", not "no
# difference". The fallback is reported in the job summary rather than left for a
# reviewer to infer from a cache-hit line buried in the log.
#
# The container tag MUST match @playwright/test in package.json (pinned exact).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Baselines ──────────────────────────────────────────────────────────────
  # Default branch (and manual dispatch): regenerate the baseline set and seed
  # the cache that PR runs restore from. Keyed by the registry + the harness, so
  # any change that alters rendering yields a fresh baseline set on merge.
  baselines:
    if: github.event_name != 'pull_request'
    name: Seed baselines (Linux container)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Restore / seed baseline cache
        id: cache
        uses: actions/cache@v4
        with:
          path: tests/visual/__screenshots__
          key: visual-baselines-linux-pw1.61.1-${{ hashFiles('registry/**/*.css', 'registry/**/*.html', 'src/scaffolds/**/*.ts', 'src/utils/breakpoints.ts', 'tests/scaffolds/**/*.ts', 'tests/visual/**/*.ts', 'playwright.config.ts') }}

      # An exact hit means this exact input already has a baseline set: nothing
      # rendered differently, so there is nothing to diff and nothing to write.
      #
      # A miss means the render changed. Restore the newest set from the default
      # branch and DIFF against it before writing anything — the step this job
      # never had, and the reason a non-PR push could absorb a regression as the
      # new truth.
      - name: Restore the previous baseline set (for the diff)
        id: previous
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: tests/visual/__screenshots__
          key: visual-baselines-never-matches-${{ github.run_id }}
          restore-keys: |
            visual-baselines-linux-pw1.61.1-

      # `[visual-baseline]` in the commit message is how an intended visual
      # change is blessed on a direct push. It is deliberately explicit: an
      # unblessed difference is a regression until somebody says otherwise.
      # Every untrusted value arrives through `env`, never through `${{ }}`
      # interpolated into the script: a commit message is attacker-controlled
      # text, and pasting it into a shell line is how a workflow runs it.
      - name: Decide whether this push may re-baseline unchecked
        id: bless
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          EVENT: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PREVIOUS_KEY: ${{ steps.previous.outputs.cache-matched-key }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            echo "blessed=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qF '[visual-baseline]'; then
            echo "reason=commit message carries [visual-baseline]" >> "$GITHUB_OUTPUT"
            echo "blessed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$PREVIOUS_KEY" ]; then
            echo "reason=no previous baseline set exists to diff against" >> "$GITHUB_OUTPUT"
            echo "blessed=true" >> "$GITHUB_OUTPUT"
          else
            echo "reason=diffing against $PREVIOUS_KEY" >> "$GITHUB_OUTPUT"
            echo "blessed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff against the previous baselines
        if: steps.cache.outputs.cache-hit != 'true' && steps.bless.outputs.blessed != 'true'
        env:
          REASON: ${{ steps.bless.outputs.reason }}
        run: |
          echo "::notice::$REASON"
          npx playwright test --reporter=line

      - name: Upload the diff report when the check fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diff
          path: playwright-report/
          retention-days: 7

      - name: Generate baselines (on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf tests/visual/__screenshots__
          npx playwright test --update-snapshots --reporter=line

  # ── PR gate ────────────────────────────────────────────────────────────────
  # Restore the default-branch baselines and diff, sharded four ways for headroom
  # (full suite is ~2-3 min unsharded; sharding keeps each runner ~1 min and
  # parallelises the diff artifacts). One viewport, per playwright.config.ts.
  visual:
    if: github.event_name == 'pull_request'
    name: Diff shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Restore baseline cache
        id: baselines
        uses: actions/cache/restore@v4
        with:
          path: tests/visual/__screenshots__
          key: visual-baselines-linux-pw1.61.1-${{ hashFiles('registry/**/*.css', 'registry/**/*.html', 'src/scaffolds/**/*.ts', 'src/utils/breakpoints.ts', 'tests/scaffolds/**/*.ts', 'tests/visual/**/*.ts', 'playwright.config.ts') }}
          # Fall back to the newest baseline set from the default branch when the
          # registry changed in this PR — changed/added components then show up as
          # diffs (or missing-baseline failures) to review, which is the point.
          restore-keys: |
            visual-baselines-linux-pw1.61.1-
      # An inexact restore means this PR changed something in the cache key, so
      # the set being diffed against is OLDER than this PR's own inputs. A green
      # shard then means "no difference from an older render", which is not the
      # same claim — say so where a reviewer will see it. [W3-5]
      - name: Report a stale baseline set
        if: steps.baselines.outputs.cache-hit != 'true'
        env:
          MATCHED: ${{ steps.baselines.outputs.cache-matched-key }}
        run: |
          if [ -z "$MATCHED" ]; then
            echo "::warning::No baseline set restored — every capture in this shard is a missing-baseline failure, not a diff."
            echo "**Visual baselines: none restored.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Diffing against an OLDER baseline set ($MATCHED): this PR changed the cache key, so a pass means 'no difference from a previous render', not 'no difference'."
            echo "**Visual baselines: stale.** Diffed against \`$MATCHED\` because this PR changed the render inputs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run shard ${{ matrix.shard }}/4
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  # ── Merge shard reports into one HTML diff report (the PR artifact) ─────────
  merge-report:
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    name: Merge diff report
    needs: visual
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: visual-blob-*
          merge-multiple: true
      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload diff report
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: playwright-report/
          retention-days: 14
