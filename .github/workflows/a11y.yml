name: Accessibility (axe-core)

# Task 0.4-24 · FAQIR-PLAN §12.3 · mobile sweep added by 0.8-11 (§19)
#
# axe-core scan of every registry reference page (tests/a11y/a11y.pw.ts), across
# the default + high-contrast themes in light and dark, generated from the same
# registry-discovery util the visual suite uses. Zero-violation policy: any
# non-exempt WCAG 2.0/2.1 A/AA violation fails the job, and the log names the
# component (case id), the rule, and the offending selector(s).
#
# Scan count at the current registry:
#
#   components  86 × 2 themes × 2 schemes            = 344   (a11y.pw.ts, 1280px)
#   density      2 themes × 2 schemes                =   4
#   mobile      26 layout-bearing × 2 × 2            = 104   (mobile.pw.ts, 390px)
#   docs site + scaffolds                            = 213
#                                                      ───
#                                                      665 scans (668 tests)
#
# The mobile sweep (tests/a11y/mobile.pw.ts) re-scans only the layout-bearing set
# — manifest `category: layout` or `kind: pattern`, the same discovery the visual
# suite's viewport axis uses — at 390px. A mobile layout is a different DOM
# rendering of the same markup with its own failure classes (off-canvas but
# focusable regions, panes hidden by a media query, tables that become scrollable
# only when narrow). It shares the ONE exemption list: a mobile-only exemption
# would be a mobile-only accessibility bug.
#
# Runs in the pinned Playwright container so chromium is present and matches
# @playwright/test — axe evaluates the DOM/CSS (not pixels), so results are
# platform-independent and need no baselines or sharding.
#
# The matrix-generation + exemption + reporting meta-tests (a11y-matrix.test.ts)
# run in the fast bun `test` job of ci.yml — this job is only the browser scan.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe scan (WCAG 2 A/AA)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Run axe suite
        run: npx playwright test --config=playwright.a11y.config.ts --reporter=list
