<!-- @ui:component calendar -->
<!-- @ui:kind recipe -->

<!-- @ui:controller calendar.js -->

<!-- Default (medium, single selection) -->
<div data-ui="calendar" data-size="md">
  <div data-part="header">
    <button data-part="nav-prev" type="button" aria-label="Previous month">&lsaquo;</button>
    <span data-part="month-label" aria-live="polite"></span>
    <button data-part="nav-next" type="button" aria-label="Next month">&rsaquo;</button>
  </div>
  <table data-part="grid" role="grid" aria-label="Calendar">
    <thead>
      <tr>
        <th scope="col" abbr="Sunday">Su</th>
        <th scope="col" abbr="Monday">Mo</th>
        <th scope="col" abbr="Tuesday">Tu</th>
        <th scope="col" abbr="Wednesday">We</th>
        <th scope="col" abbr="Thursday">Th</th>
        <th scope="col" abbr="Friday">Fr</th>
        <th scope="col" abbr="Saturday">Sa</th>
      </tr>
    </thead>
    <tbody data-part="grid-body">
      <!-- Day cells are generated by the controller -->
    </tbody>
  </table>
</div>

<!-- Range with presets and two months
     Click a start, hover to preview the span, click an end, or pick a preset.
     The summary reads the selection back; on a phone the months stack. -->
<div data-ui="calendar" data-size="md" data-mode="range" data-months="2" data-value="2026-10-12,2026-10-18">
  <div data-part="presets" role="group" aria-label="Quick ranges">
    <button data-part="preset" type="button" data-value="today" aria-pressed="false">Today</button>
    <button data-part="preset" type="button" data-value="yesterday" aria-pressed="false">Yesterday</button>
    <button data-part="preset" type="button" data-value="last-7-days" aria-pressed="false">Last 7 days</button>
    <button data-part="preset" type="button" data-value="last-30-days" aria-pressed="false">Last 30 days</button>
    <button data-part="preset" type="button" data-value="this-month" aria-pressed="false">This month</button>
    <button data-part="preset" type="button" data-value="last-month" aria-pressed="false">Last month</button>
  </div>
  <div data-part="header">
    <button data-part="nav-prev" type="button" aria-label="Previous month">&lsaquo;</button>
    <span data-part="month-label" aria-live="polite"></span>
    <button data-part="nav-next" type="button" aria-label="Next month">&rsaquo;</button>
  </div>
  <table data-part="grid" role="grid" aria-label="Calendar">
    <thead>
      <tr>
        <th scope="col" abbr="Sunday">Su</th>
        <th scope="col" abbr="Monday">Mo</th>
        <th scope="col" abbr="Tuesday">Tu</th>
        <th scope="col" abbr="Wednesday">We</th>
        <th scope="col" abbr="Thursday">Th</th>
        <th scope="col" abbr="Friday">Fr</th>
        <th scope="col" abbr="Saturday">Sa</th>
      </tr>
    </thead>
    <tbody data-part="grid-body">
      <!-- Day cells are generated by the controller -->
    </tbody>
  </table>
  <p data-part="summary" aria-live="polite">No dates selected</p>
</div>

<!-- Range length bounds: stays of 3 to 14 days
     While the end is chosen, days that would make the stay shorter or longer
     are unavailable; booked nights are disabled, and so is a preset that cannot fit. -->
<div data-ui="calendar" data-size="md" data-mode="range" data-months="2"
     data-value="2026-11-09,2026-11-13"
     data-min-range="3"
     data-max-range="14"
     data-disabled-dates="2026-11-06, 2026-11-07, 2026-11-20, 2026-11-21">
  <div data-part="presets" role="group" aria-label="Suggested stays">
    <button data-part="preset" type="button" data-value="next-7-days" aria-pressed="false">Next 7 days</button>
    <button data-part="preset" type="button" data-value="next-14-days" aria-pressed="false">Next 14 days</button>
    <button data-part="preset" type="button" data-value="next-30-days" aria-pressed="false">Next 30 days</button>
    <button data-part="preset" type="button" data-start="2026-11-23" data-end="2026-11-29" aria-pressed="false">Thanksgiving week</button>
  </div>
  <div data-part="header">
    <button data-part="nav-prev" type="button" aria-label="Previous month">&lsaquo;</button>
    <span data-part="month-label" aria-live="polite"></span>
    <button data-part="nav-next" type="button" aria-label="Next month">&rsaquo;</button>
  </div>
  <table data-part="grid" role="grid" aria-label="Check-in and check-out">
    <thead>
      <tr>
        <th scope="col" abbr="Sunday">Su</th>
        <th scope="col" abbr="Monday">Mo</th>
        <th scope="col" abbr="Tuesday">Tu</th>
        <th scope="col" abbr="Wednesday">We</th>
        <th scope="col" abbr="Thursday">Th</th>
        <th scope="col" abbr="Friday">Fr</th>
        <th scope="col" abbr="Saturday">Sa</th>
      </tr>
    </thead>
    <tbody data-part="grid-body">
      <!-- Day cells are generated by the controller -->
    </tbody>
  </table>
  <p data-part="summary" aria-live="polite">Stays of 3 to 14 days</p>
</div>
