<!-- @ui:component date-picker -->
<!-- @ui:kind recipe -->
<!-- @ui:slots value value-end trigger field input separator input-end clear icon error calendar -->
<!-- @ui:variants style=popover|inline size=sm|md|lg -->
<!-- @ui:controller date-picker.js -->
<!-- @ui:composes calendar (calendar.js owns the month grid) -->

<!-- Default (medium), inside a form: the hidden value part carries the name
     and submits the ISO date; the visible input shows it as a person reads it -->
<div data-ui="date-picker" data-state="closed" data-size="md">
  <input data-part="value" type="hidden" name="due-date">
  <div data-part="trigger">
    <input
      data-part="input"
      type="text"
      role="combobox"
      placeholder="Select a date"
      readonly
      aria-haspopup="dialog"
      aria-expanded="false"
      aria-label="Choose date"
    >
    <button data-part="clear" type="button" aria-label="Clear date" hidden><span data-ui="icon" data-icon="x" aria-hidden="true"></span></button>
    <span data-part="icon" data-ui="icon" data-icon="calendar" aria-hidden="true"></span>
  </div>
  <div data-part="calendar" role="dialog" aria-label="Date picker" hidden>
    <div data-ui="calendar" data-size="md">
      <div data-part="header">
        <button data-part="nav-prev" type="button" aria-label="Previous month">&lsaquo;</button>
        <span data-part="month-label" aria-live="polite"></span>
        <button data-part="nav-next" type="button" aria-label="Next month">&rsaquo;</button>
      </div>
      <table data-part="grid" role="grid" aria-label="Calendar">
        <thead>
          <tr>
            <th scope="col" abbr="Sunday">Su</th>
            <th scope="col" abbr="Monday">Mo</th>
            <th scope="col" abbr="Tuesday">Tu</th>
            <th scope="col" abbr="Wednesday">We</th>
            <th scope="col" abbr="Thursday">Th</th>
            <th scope="col" abbr="Friday">Fr</th>
            <th scope="col" abbr="Saturday">Sa</th>
          </tr>
        </thead>
        <tbody data-part="grid-body">
          <!-- Day cells are generated by the calendar controller -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Range with presets and two months
     Start and end fields; two months when the viewport has room, one on a phone.
     Each end submits its own ISO date through value and value-end. -->
<div data-ui="date-picker" data-state="closed" data-size="md" data-mode="range">
  <input data-part="value" type="hidden" name="report-start">
  <input data-part="value-end" type="hidden" name="report-end">
  <div data-part="field">
    <input data-part="input" type="text" role="combobox" readonly aria-haspopup="dialog" aria-expanded="false" aria-label="Start date" placeholder="Start date">
    <span data-part="separator" aria-hidden="true">&rarr;</span>
    <input data-part="input-end" type="text" role="combobox" readonly aria-haspopup="dialog" aria-expanded="false" aria-label="End date" placeholder="End date">
    <button data-part="clear" type="button" aria-label="Clear dates" hidden><span data-ui="icon" data-icon="x" aria-hidden="true"></span></button>
    <button data-part="trigger" type="button" aria-label="Open calendar" tabindex="-1"><span data-ui="icon" data-icon="calendar" aria-hidden="true"></span></button>
  </div>
  <div data-part="calendar" role="dialog" aria-label="Choose a date range" hidden>
    <div data-ui="calendar" data-size="md" data-mode="range" data-months="2">
      <div data-part="presets" role="group" aria-label="Quick ranges">
        <button data-part="preset" type="button" data-value="today" aria-pressed="false">Today</button>
        <button data-part="preset" type="button" data-value="yesterday" aria-pressed="false">Yesterday</button>
        <button data-part="preset" type="button" data-value="last-7-days" aria-pressed="false">Last 7 days</button>
        <button data-part="preset" type="button" data-value="last-30-days" aria-pressed="false">Last 30 days</button>
        <button data-part="preset" type="button" data-value="this-month" aria-pressed="false">This month</button>
        <button data-part="preset" type="button" data-value="last-month" aria-pressed="false">Last month</button>
      </div>
      <div data-part="header">
        <button data-part="nav-prev" type="button" aria-label="Previous month">&lsaquo;</button>
        <span data-part="month-label" aria-live="polite"></span>
        <button data-part="nav-next" type="button" aria-label="Next month">&rsaquo;</button>
      </div>
      <table data-part="grid" role="grid" aria-label="Calendar">
        <thead>
          <tr>
            <th scope="col" abbr="Sunday">Su</th>
            <th scope="col" abbr="Monday">Mo</th>
            <th scope="col" abbr="Tuesday">Tu</th>
            <th scope="col" abbr="Wednesday">We</th>
            <th scope="col" abbr="Thursday">Th</th>
            <th scope="col" abbr="Friday">Fr</th>
            <th scope="col" abbr="Saturday">Sa</th>
          </tr>
        </thead>
        <tbody data-part="grid-body">
          <!-- Day cells are generated by the calendar controller -->
        </tbody>
      </table>
      <p data-part="summary" aria-live="polite">Pick a start date</p>
    </div>
  </div>
</div>

<!-- Typed input, read in the page's language
     Type 3/14/2026, 14 Mar 2026 or 2026-03-14, then Tab or Enter: the date is
     checked against min/max and disabled days and shown in full; an invalid one
     keeps its text and is marked. ArrowDown opens the calendar. -->
<div data-ui="date-picker" data-state="closed" data-size="md">
  <input data-part="value" type="hidden" name="start-date">
  <div data-part="field">
    <input data-part="input" type="text" role="combobox" aria-haspopup="dialog" aria-expanded="false" aria-label="Start date" aria-errormessage="start-date-error" autocomplete="off">
    <button data-part="clear" type="button" aria-label="Clear date" hidden><span data-ui="icon" data-icon="x" aria-hidden="true"></span></button>
    <button data-part="trigger" type="button" aria-label="Open calendar" tabindex="-1"><span data-ui="icon" data-icon="calendar" aria-hidden="true"></span></button>
  </div>
  <p data-part="error" id="start-date-error" aria-live="polite" hidden>Enter a date in 2026, like 3/14/2026 — December 25 and 26 are closed.</p>
  <div data-part="calendar" role="dialog" aria-label="Choose a start date" hidden>
    <div data-ui="calendar" data-size="md" data-min="2026-01-01" data-max="2026-12-31" data-disabled-dates="2026-12-25, 2026-12-26">
      <div data-part="header">
        <button data-part="nav-prev" type="button" aria-label="Previous month">&lsaquo;</button>
        <span data-part="month-label" aria-live="polite"></span>
        <button data-part="nav-next" type="button" aria-label="Next month">&rsaquo;</button>
      </div>
      <table data-part="grid" role="grid" aria-label="Calendar">
        <thead>
          <tr>
            <th scope="col" abbr="Sunday">Su</th>
            <th scope="col" abbr="Monday">Mo</th>
            <th scope="col" abbr="Tuesday">Tu</th>
            <th scope="col" abbr="Wednesday">We</th>
            <th scope="col" abbr="Thursday">Th</th>
            <th scope="col" abbr="Friday">Fr</th>
            <th scope="col" abbr="Saturday">Sa</th>
          </tr>
        </thead>
        <tbody data-part="grid-body">
          <!-- Day cells are generated by the calendar controller -->
        </tbody>
      </table>
    </div>
  </div>
</div>

        <tbody data-part="grid-body">
