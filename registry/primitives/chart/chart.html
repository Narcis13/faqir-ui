<!-- @ui:component chart -->
<!-- @ui:kind primitive -->
<!-- @ui:slots caption plot data -->
<!-- @ui:variants variant=column|bar|line -->
<!-- @ui:requires faqir-chart.js -->
<!--
  The table is the chart. Without JavaScript it is what the reader sees, on
  screen and on paper. With faqir-chart.js loaded, the plugin draws an inline
  SVG into the plot part from the same cells, sets data-state="drawn", and the
  table moves out of sight on screen — still there for a screen reader, and
  printed under the chart on paper.
-->

<!-- Column (the default kind): one series, the value axis from zero -->
<figure data-ui="chart">
  <figcaption data-part="caption">Invoices paid per quarter</figcaption>
  <div data-part="plot"></div>
  <table data-part="data">
    <thead>
      <tr><th scope="col">Quarter</th><th scope="col">Invoices</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">Q1</th><td>42</td></tr>
      <tr><th scope="row">Q2</th><td>57</td></tr>
      <tr><th scope="row">Q3</th><td>61</td></tr>
      <tr><th scope="row">Q4</th><td>48</td></tr>
    </tbody>
  </table>
</figure>

<!-- Bar: three series, told apart by lightness; the series names sit on the marks -->
<figure data-ui="chart" data-variant="bar">
  <figcaption data-part="caption">Revenue by region, thousand euro</figcaption>
  <div data-part="plot"></div>
  <table data-part="data">
    <thead>
      <tr><th scope="col">Region</th><th scope="col">2023</th><th scope="col">2024</th><th scope="col">2025</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">North</th><td>1,240</td><td>1,380</td><td>1,510</td></tr>
      <tr><th scope="row">South</th><td>860</td><td>940</td><td>1,020</td></tr>
      <tr><th scope="row">West</th><td>410</td><td>520</td><td>690</td></tr>
    </tbody>
  </table>
</figure>

<!-- Line: three series, told apart by lightness and by dash pattern -->
<figure data-ui="chart" data-variant="line">
  <figcaption data-part="caption">Average days to payment</figcaption>
  <div data-part="plot"></div>
  <table data-part="data">
    <thead>
      <tr><th scope="col">Month</th><th scope="col">Retail</th><th scope="col">Wholesale</th><th scope="col">Public sector</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">Jan</th><td>18</td><td>34</td><td>52</td></tr>
      <tr><th scope="row">Feb</th><td>17</td><td>31</td><td>55</td></tr>
      <tr><th scope="row">Mar</th><td>15</td><td>33</td><td>49</td></tr>
      <tr><th scope="row">Apr</th><td>16</td><td>29</td><td>47</td></tr>
      <tr><th scope="row">May</th><td>14</td><td>27</td><td>44</td></tr>
      <tr><th scope="row">Jun</th><td>13</td><td>28</td><td>41</td></tr>
    </tbody>
  </table>
</figure>

<!-- The table on screen too: data-table="visible" keeps it in view after the chart draws -->
<figure data-ui="chart" data-variant="column" data-table="visible">
  <figcaption data-part="caption">Net cash flow, thousand euro</figcaption>
  <div data-part="plot"></div>
  <table data-part="data">
    <thead>
      <tr><th scope="col">Month</th><th scope="col">Net</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">Jan</th><td data-value="12.5">12.5</td></tr>
      <tr><th scope="row">Feb</th><td data-value="-4.2">−4.2</td></tr>
      <tr><th scope="row">Mar</th><td data-value="8.1">8.1</td></tr>
    </tbody>
  </table>
</figure>
