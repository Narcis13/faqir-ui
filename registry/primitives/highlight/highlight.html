<!-- @ui:component highlight -->
<!-- @ui:kind primitive -->
<!-- @ui:slots -->
<!-- @ui:variants style=gradient|shimmer|marker|underline -->
<!--
  Highlight — the words a headline wants you to read first. CSS only.
    · Inline: wrap a few words inside a heading or a paragraph.
    · The text is real text. Every effect is a background under or clipped to
      the glyphs, so it is selectable, searchable and announced once.
    · data-animate plays the variant's motion: a gradient pans, a marker and an
      underline are drawn in. A shimmer always moves (until reduced motion).
-->

<!-- Gradient (default) -->
<p>Ship your interface, <span data-ui="highlight">not your design system</span>.</p>

<!-- Gradient, panning -->
<p>Built for <span data-ui="highlight" data-variant="gradient" data-animate>agents and humans</span> alike.</p>

<!-- Marker — a highlighter stroke -->
<p>Every value is a <span data-ui="highlight" data-variant="marker">design token</span> a theme can change.</p>

<!-- Marker, drawn in after a delay, in a custom colour -->
<p>Zero classes, <span data-ui="highlight" data-variant="marker" data-animate style="--highlight-color: var(--color-warning); --highlight-delay: 400ms">zero build step</span>.</p>

<!-- Underline -->
<p>The selector <span data-ui="highlight" data-variant="underline">is the documentation</span>.</p>

<!-- Underline, drawn in -->
<p>Audited <span data-ui="highlight" data-variant="underline" data-animate>before it ships</span>.</p>

<!-- Shimmer — for a status line that is still working -->
<p><span data-ui="highlight" data-variant="shimmer">Generating your theme…</span></p>
